    <script>
      // Motion start states only apply when this runs (see "Motion" in index.css).
      document.documentElement.classList.add("js");
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      try {
        var saved = localStorage.getItem("theme");
        // The glass design is dark-first; light is opt-in via the toggle.
        var theme = saved === "light" || saved === "dark" ? saved : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
