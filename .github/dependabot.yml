# Weekly dependency update PRs. Minor and patch updates are grouped into one PR to
# keep the noise down; major versions (React 19, Tailwind 4, ...) arrive separately
# so they can be reviewed on their own. CI runs on every PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
